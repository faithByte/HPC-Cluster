- name: Configure Calico Pod CIDR
  ansible.builtin.replace:
    path: /tmp/calico.yaml
    regexp: '^(\s*)# - name: CALICO_IPV4POOL_CIDR\s*\n\s*#\s+value:.*$'
    replace: '\1- name: CALICO_IPV4POOL_CIDR\n\1  value: "{{ pod_cidr }}"'

# kubectl -n kube-system get cm kubeadm-config -o yaml | grep -i podSubnet | awk '{print $2}'

- name:  
  ansible.builtin.shell: |
    kubectl apply -f /tmp/calico.yaml
  ignore_errors: yes